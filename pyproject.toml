# The PyPI package ser2netweb (pip install ser2netweb, pipx install ser2netweb): the
# ser2netweb package with its templates, static files and translations, and the command
# ser2netweb (ser2netweb.cli:main). A source checkout doesn't need this file (python3
# ser2netweb.py installs the pinned dependencies from vendor/wheels into ./lib), and the
# standalone executables and the Docker image install the hash-locked pins
# (requirements-lock.txt), not these ranges.
#
# Built by CI's job "pypi package" (python -m build --no-isolation, with build and
# setuptools from the hash-locked requirements-build.txt, which the standalone builds use
# too); release.yml publishes what it built and tested. A pip install keeps its data in the
# user's data folder (ser2netweb/layout.py).
[build-system]
requires = ["setuptools>=77"]  # (license expressions, PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "ser2netweb"
dynamic = ["version"]  # ser2netweb/__init__.py's __version__
description = "Serial-to-network bridge with a web UI: raw TCP, telnet, RFC 2217, UDP, Modbus gateway, MQTT"
readme = "packaging/README.pypi.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
# also the browser libraries' texts (the web UI's static files carry htmx and xterm.js);
# an install keeps them in its .dist-info/licenses, where the /licenses page reads them
license-files = ["LICENSE", "NOTICE", "COMMERCIAL_LICENSE.md", "THIRD-PARTY-NOTICES.md",
                 "tools/licenses/npm/*.txt"]
authors = [{ name = "Halis KILIÇ", email = "mail@haliskilic.com.tr" }]
keywords = ["serial", "rs232", "rs485", "rfc2217", "telnet", "serial-over-ip", "modbus",
            "mqtt", "sparkplug", "iot"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications",
    "Topic :: System :: Hardware",
    "Topic :: System :: Networking",
]
# The packages ser2netweb imports, each from the oldest release it works with (the floor),
# so that a Linux or BSD distribution can build it with the versions it ships
# (docs/PACKAGING.md: the floors, the distributions' versions and what they lack). No
# upper bounds: one goes here only for a release known to break ser2netweb (none is). The
# floors are tested: CI's job "minimum dependencies" installs exactly requirements-min.pins
# (every floor, and the oldest dependencies of theirs a distribution there ships) on Python
# 3.10 and runs the whole suite. pip installs the newest release of each; the standalone
# executables, the Docker image and the test matrix keep to the tested, hash-locked pins
# (requirements.txt, requirements-lock.txt), and each pin has to be at or above its floor
# (tests/test_pyproject.py). Packages only these need (anyio, click, idna,
# typing_extensions, colorama) come with them. psutil (the network interface lists) has
# no pure-Python wheel: where PyPI has no wheel for the machine, pip builds it.
dependencies = [
    "pyserial>=3.5",                  # the release every distribution ships (2020)
    # not packaged by most distributions: without it ser2netweb runs on its copy of the
    # 0.16 transport (ser2netweb/engine/serial_transport.py), so a package may leave it out
    "pyserial-asyncio-fast>=0.16",
    # Debian 13; ser2netweb/web/starlette_compat.py stands in for the request body limits of
    # Starlette 1.6
    "starlette>=0.46.1",
    # Debian 13; ser2netweb/web/httpguard.py subclasses its h11 protocol, which is the same
    # from there on but for details it doesn't touch
    "uvicorn>=0.32.0",
    "h11>=0.14.0",                    # Debian 13, Ubuntu 26.04, EPEL 10
    "websockets>=14.2",               # RHEL 10 (uvicorn's WebSocket implementation)
    "python-multipart>=0.0.20",       # Debian 13, Ubuntu 26.04 (Starlette's form parser)
    "jinja2>=3.1.6",                  # what every distribution here ships
    "markupsafe>=2.1.3",              # RHEL 10
    "psutil>=5.9.8",                  # RHEL 10, Ubuntu 24.04
    # Python 3.10 only (asyncio.TaskGroup / Runner, exception groups): no distribution here
    # runs 3.10; the oldest release Ubuntu ships, and the one FreeBSD and conda-forge do
    'exceptiongroup>=1.2.0; python_version < "3.11"',
    'taskgroup>=0.2.2; python_version < "3.11"',
]

# The features that need an optional package (requirements-optional.txt, which the
# executables and the image bundle; each feature says what is missing without it):
#   pipx install "ser2netweb[all]", or pipx inject ser2netweb paho-mqtt
# The floors as above (requirements-min.pins has them too); no upper bounds.
[project.optional-dependencies]
mqtt = ["paho-mqtt>=1.6.1"]                  # MQTT publishing, Sparkplug B (1.x and 2.x)
ldap = ["ldap3>=2.9.1"]                      # LDAP / Active Directory sign-in (its last release)
oidc = ["authlib>=1.4.0"]                    # OpenID Connect single sign-on (Fedora 43)
tls = ["cryptography>=43.0.0"]               # self-signed certificates in-process (Debian 13)
all = ["ser2netweb[mqtt,ldap,oidc,tls]"]

[project.scripts]
ser2netweb = "ser2netweb.cli:main"

[project.urls]
Homepage = "https://github.com/haliskilic/ser2netweb"
Documentation = "https://github.com/haliskilic/ser2netweb/blob/main/README.en.md"
Changelog = "https://github.com/haliskilic/ser2netweb/blob/main/CHANGELOG.md"
Issues = "https://github.com/haliskilic/ser2netweb/issues"
Source = "https://github.com/haliskilic/ser2netweb"

# The ser2netweb package only (not the start scripts beside it, ser2netweb.py, ser2net.py
# and bootstrap.py, which a source checkout runs), with the files it reads at run time.
# The sdist has what the wheel is built from: these, the readme, the licence files and this
# file; not the tests, vendor/wheels or anything a build left in the tree (no MANIFEST.in;
# CI's job "pypi package" checks both files' contents).
[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["ser2netweb", "ser2netweb.*"]

[tool.setuptools.package-data]
ser2netweb = ["locale/*", "web/templates/*", "web/static/*"]

# (named by its file: for "ser2netweb.__version__" setuptools would read ser2netweb.py, the
# start script beside the package; it reads the assignment without importing anything)
[tool.setuptools.dynamic]
version = { attr = "ser2netweb.__init__.__version__" }
