name: CI

# Pull requests (to any branch, so stacked PRs are tested too) and pushes to main.
# A branch push without a PR no longer runs the suite a second time. release.yml calls
# this workflow too, so a release tag runs exactly these checks before anything is
# published (and its standalone build is the one released).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      publish:
        description: A release build (standalone.yml signs the Windows exe when configured)
        type: boolean
        default: false
    secrets:  # code signing (docs/SIGNING.md); handed on to standalone.yml for a release build
      AZURE_TENANT_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      SIGNPATH_API_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  # A new commit on a PR supersedes the running check. Every other run (each push to main,
  # a manual run) has a group of its own: GitHub keeps only one waiting run per group, so
  # a shared main group dropped the middle commits of a quick series of merges.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.3
      - run: ruff check . --output-format github

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      # with the optional packages and pyserial's stubs, so the MQTT / OIDC / certificate
      # and serial code is checked against their real types instead of Any
      - run: >-
          pip install -r requirements.txt -r requirements-optional.txt
          types-pyserial==3.5.0.20261104 mypy==2.4.1
      - run: mypy
      # the Windows-only code paths, and POSIX-only calls (fcntl, os.getuid, ...) that
      # reach code Windows runs too
      - name: mypy --platform win32
        run: mypy --platform win32

  # The workflows themselves: unpinned third-party actions, template injection, credentials
  # left in the checkout, over-broad permissions (settings: .github/zizmor.yml)
  workflows:
    name: workflow lint (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install zizmor==1.32.0
      - run: zizmor --offline --format=github .

  # pip-audit on Python 3.10 and 3.12, Linux and Windows (the same workflow release.yml and
  # scheduled.yml use)
  audit:
    uses: ./.github/workflows/audit.yml

  # Everything derived from the pins: the offline wheels, the build locks and the vendored
  # browser libraries (vendor/npm/package.json). The test legs skip these checks
  # (SER2NET_SKIP_PIN_CHECKS), so a Dependabot bump fails here alone while the matrix shows
  # whether the new versions work. On a failure, the refreshed files are attached (artifact
  # "refreshed-pins") and the summary says how to apply them; on Dependabot's branches
  # .github/workflows/refresh-pins.yml pushes them.
  vendor:
    name: offline wheels match requirements.txt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: python tests/test_vendor_wheels.py
      - run: python tests/test_build_lock.py
      - run: python tests/test_vendor_assets.py
      - run: python tests/test_third_party.py   # the license overrides are for the pinned versions
      # every wheel is the file PyPI publishes (its sha256 from PyPI's JSON API), or the
      # byte-for-byte rebuild of the pure-Python repack from one
      - name: The wheels are PyPI's files
        run: python tools/refresh_wheels.py --verify
      # the image's and the binaries' hash locks: every hash is a file PyPI publishes for
      # that release, every target (Linux x86_64/aarch64, Windows x64) has a wheel among
      # them, and every dependency there is locked
      - name: The build locks match PyPI
        run: python tools/refresh_locks.py --verify
      # the vendored htmx / xterm.js files are byte for byte those of the npm releases
      # vendor/npm/package.json pins (each tarball checked against the registry's sha512)
      - name: The browser libraries are the npm releases' files
        run: python tools/refresh_assets.py --verify
      - name: The refreshed wheels and locks, as a patch (on failure)
        if: failure()
        run: |
          python tools/refresh_wheels.py || true
          python tools/refresh_locks.py --check || python tools/refresh_locks.py || true
          python tools/refresh_assets.py --check || python tools/refresh_assets.py || true
          paths=(vendor/wheels requirements-lock.txt requirements-build.txt vendor/npm
                 app/web/static tools/licenses/npm)
          git add --intent-to-add "${paths[@]}"
          git diff --binary -- "${paths[@]}" > refreshed-pins.patch
          git diff --stat -- "${paths[@]}"
          {
            echo "### The offline wheels, build locks or browser libraries don't match the pins"
            echo
            echo "Refresh them on the branch and commit the result:"
            echo
            echo '```'
            echo 'python tools/refresh_wheels.py && python tools/refresh_locks.py && python tools/refresh_assets.py'
            echo "git add ${paths[*]}"
            echo 'git commit -m "deps: refresh the offline wheels, build locks and browser libraries"'
            echo '```'
            echo
            echo 'or download the artifact **refreshed-pins** of this run and `git apply --binary refreshed-pins.patch`.'
            echo "Dependabot's pull requests get it pushed by Actions -> Refresh pinned files (which also starts CI)."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: failure()
        with:
          name: refreshed-pins
          path: refreshed-pins.patch
          retention-days: 14

  ui:
    name: ui layout (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies + Playwright Chromium
        run: |
          pip install -r requirements.txt playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Long names stay inside their panels (desktop, half-screen, tablet, phone)
        env:
          SER2NET_UI_TESTS: "1"          # a missing browser fails here instead of skipping
          SER2NET_UI_ARTIFACTS: ui-screenshots
        run: python tests/test_ui_layout.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: ui-screenshots
          path: ui-screenshots
          retention-days: 14

  test:
    name: test ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # The py3.12 legs (the binaries' and the image's Python) also install the pinned
        # optional packages, so the LDAP / OIDC / MQTT code paths run with ldap3, authlib
        # and paho-mqtt; the other legs keep testing ser2net without them.
        include:
          - python-version: "3.12"
            optional: true
    env:
      # tests/test_dead_peer.py: run the real half-open-connection scenarios (they
      # blackhole a loopback flow — iptables via passwordless sudo on Linux, WinDivert
      # as Administrator on Windows). Set in CI, a missing backend fails, not skips.
      SER2NET_BLACKHOLE_TESTS: "1"
      # tests/test_windows_service.py: install / restart / remove a real service
      # (python + ser2net.py) on the Windows runner (Administrator)
      SER2NET_SERVICE_TESTS: "1"
      # tests/_optional.py: where the optional packages are installed, a test that
      # needs a missing one fails instead of skipping
      SER2NET_OPTIONAL_TESTS: ${{ matrix.optional && '1' || '' }}
      # the wheels / locks against the pins: the vendor job's (one red check on a bump)
      SER2NET_SKIP_PIN_CHECKS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # What a source install does on its first run, before anything else is installed:
      # bootstrap.py puts the pinned dependencies from vendor/wheels into ./lib with
      # pip --no-index (no network), and the app has to import from there. ./lib is
      # removed again, so the suite below runs on the packages installed next.
      - name: Offline first run (bootstrap.py from vendor/wheels, the app imports from ./lib)
        shell: bash
        run: |
          python bootstrap.py
          python -c "import os, sys; sys.path[:0] = ['lib', '.']
          import serial, starlette, uvicorn, app.runtime, app.web.server
          lib = os.path.abspath('lib')
          assert all(os.path.abspath(m.__file__).startswith(lib) for m in (serial, starlette, uvicorn))"
          python ser2net.py --about
          rm -rf lib
      - name: Install dependencies (+ cryptography for the in-process certificate tests)
        run: pip install -r requirements.txt cryptography
      - name: Install the optional packages (MQTT / LDAP / OIDC; py3.12 legs)
        if: matrix.optional
        run: pip install -r requirements-optional.txt
      - name: Install socat (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y socat
      - name: Install pydivert (Windows dead-peer test)
        if: runner.os == 'Windows'
        run: pip install pydivert==4.0.1
      - name: Run portable test suite (Windows)
        if: runner.os == 'Windows'
        run: python tests/run_all.py -v
      - name: Run full test suite incl. socat data-path (Linux)
        if: runner.os == 'Linux'
        run: python tests/run_all.py --socat -v

  # The newest Python, before its wheels have all settled: shows what breaks there
  # without blocking a merge (not in ci-ok's needs, continue-on-error). Move it into the
  # matrix above once it passes. Not run for a release (github.workflow_ref is then
  # release.yml's), which it must not hold up.
  test-next:
    name: test ${{ matrix.os }} py3.15 (not required)
    if: ${{ !contains(github.workflow_ref, '/.github/workflows/release.yml@') }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      SER2NET_BLACKHOLE_TESTS: "1"
      SER2NET_SERVICE_TESTS: "1"
      SER2NET_SKIP_PIN_CHECKS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - run: pip install -r requirements.txt cryptography
      - name: Install socat (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y socat
      - name: Install pydivert (Windows dead-peer test)
        if: runner.os == 'Windows'
        run: pip install pydivert==4.0.1
      - name: Run portable test suite (Windows)
        if: runner.os == 'Windows'
        run: python tests/run_all.py -v
      - name: Run full test suite incl. socat data-path (Linux)
        if: runner.os == 'Linux'
        run: python tests/run_all.py --socat -v

  coverage:
    name: coverage (Linux, full suite)
    runs-on: ubuntu-latest
    env:
      SER2NET_BLACKHOLE_TESTS: "1"
      SER2NET_OPTIONAL_TESTS: "1"
      SER2NET_SKIP_PIN_CHECKS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      # with the optional packages, so the LDAP / OIDC / MQTT code is measured too
      - run: pip install -r requirements.txt -r requirements-optional.txt coverage==7.17.1
      - run: sudo apt-get update && sudo apt-get install -y socat
      - name: Run the suite under coverage (servers the tests spawn are measured too)
        run: python tests/coverage_run.py
      - name: Report
        run: |
          coverage report --skip-empty --sort=cover > coverage.txt
          grep '^TOTAL' coverage.txt
          # the whole table, least-covered modules first
          { echo '### Coverage'; echo; coverage report --skip-empty --sort=cover --format=markdown; } >> "$GITHUB_STEP_SUMMARY"
          coverage html --skip-empty -d coverage-html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage
          path: |
            coverage.txt
            coverage-html
          retention-days: 14
      # Last, so the report above is uploaded also when it fails. Measured on Linux only
      # (the Windows-only modules count as missed); set with headroom below the 88.8% a
      # full run measured. Raise it by hand after pull requests that add tests. Not in
      # .coveragerc, so a local run without socat or the blackhole tests doesn't fail.
      - name: Coverage floor
        run: coverage report --format=total --fail-under=87

  # The Docker image on amd64 + arm64 (for a release, release.yml then smoke-tests the
  # image it pushes to GHCR with the same script).
  docker:
    uses: ./.github/workflows/docker.yml

  # Build the standalone executables and prove they need nothing else installed. Heavy,
  # so: pull requests and main only; called from release.yml, these are the released files.
  standalone:
    permissions:
      contents: read
      actions: read   # the reusable workflow requests it (SignPath); the caller must grant it
    uses: ./.github/workflows/standalone.yml
    with:
      publish: ${{ inputs.publish == true }}
    # the signing credentials only for a release build, never for a pull request or main
    secrets:
      AZURE_TENANT_ID: ${{ inputs.publish && secrets.AZURE_TENANT_ID || '' }}
      AZURE_CLIENT_ID: ${{ inputs.publish && secrets.AZURE_CLIENT_ID || '' }}
      AZURE_CLIENT_SECRET: ${{ inputs.publish && secrets.AZURE_CLIENT_SECRET || '' }}
      SIGNPATH_API_TOKEN: ${{ inputs.publish && secrets.SIGNPATH_API_TOKEN || '' }}

  # The one check for branch protection to require (with license/cla): it passes only when
  # every job above passed, so jobs added to or renamed in this workflow need no settings
  # change. A needed job that failed, was cancelled or was skipped fails it (GitHub would
  # count a skipped required check as passed, hence if: always() and the explicit check).
  # test-next is left out on purpose: it may fail.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint, typecheck, workflows, audit, vendor, ui, test, coverage, docker, standalone]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
