name: Refresh pinned files

# A Dependabot pip pull request bumps requirements.txt (and, itself, the hashes in
# requirements-lock.txt / requirements-build.txt), but the offline wheels in vendor/wheels
# have to follow: until they do, CI's "offline wheels match requirements.txt" fails. This
# workflow refreshes them on each push to a Dependabot pull request's branch in this
# repository, and on any other branch but main when started by hand (Actions -> Refresh
# pinned files -> Run workflow -> the branch). It commits the result as github-actions[bot]
# and starts CI on that commit: a push made with the workflow's token starts no workflow by
# itself, but a workflow_dispatch does, and its checks count for the pull request. A
# Dependabot npm pull request (vendor/npm/package.json) gets the bumped browser libraries'
# files copied into app/web/static the same way. Review the pull request's diff as before:
# the wheels are PyPI's files and the browser libraries the npm releases' (CI checks both).
on:
  pull_request:
    paths:
      - requirements.txt
      - requirements-optional.txt
      - vendor/npm/package.json   # the browser libraries (Dependabot's npm updates)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-pins-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  refresh:
    name: refresh the offline wheels, build locks and browser libraries on the branch
    # a pull request Dependabot opened from a branch of this repository (a fork's pull
    # request never gets a writing token anyway); or a manual run
    if: >-
      (github.event_name == 'pull_request'
       && github.event.pull_request.user.login == 'dependabot[bot]'
       && github.event.pull_request.head.repo.full_name == github.repository
       && startsWith(github.head_ref, 'dependabot/'))
      || (github.event_name == 'workflow_dispatch' && github.ref_type == 'branch'
          && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the refreshed files onto the branch
      actions: write         # start CI on the new commit
    env:
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref }}   # the branch itself, not a merge commit
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      # pip download --no-deps --only-binary=:all: of the pinned versions: no package code runs
      - name: Refresh vendor/wheels (and the locks and browser libraries, if they don't match)
        run: |
          python tools/refresh_wheels.py
          python tools/refresh_locks.py --verify || python tools/refresh_locks.py   # e.g. a new PyInstaller dependency
          python tools/refresh_assets.py --check || python tools/refresh_assets.py
          python tools/refresh_wheels.py --verify
          python tools/refresh_locks.py --verify
          python tools/refresh_assets.py --verify
      - id: push
        name: Commit and push them to the branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          git add vendor/wheels requirements-lock.txt requirements-build.txt vendor/npm \
                  app/web/static tools/licenses/npm
          if git diff --cached --quiet; then
            echo "nothing to refresh on $BRANCH"
            exit 0
          fi
          git diff --cached --stat
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "deps: refresh the offline wheels, build locks and browser libraries"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
              push origin "HEAD:refs/heads/$BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Start CI on the new commit
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "$BRANCH" -R "$GITHUB_REPOSITORY"
