name: Release

# On a v* tag (git tag -a v2.8.0 -m "..." && git push origin v2.8.0): build the
# standalone executables (Linux x86_64 + arm64, Windows x64; no Python or anything else
# needed) and the Docker image (amd64 + arm64), run every check on them — bundle
# contents, empty-PATH run, clean AlmaLinux/Debian/Ubuntu/Fedora/openSUSE containers,
# the Windows service, the image's non-root / upgrade smoke test — and only then
# publish: the release assets with SHA256SUMS, SBOMs, license texts and build
# provenance, and the image on GHCR. The write permissions belong to the two publish
# jobs alone.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  standalone:
    permissions:
      contents: read
      actions: read       # the reusable workflow requests it (SignPath); the caller must grant it
    uses: ./.github/workflows/standalone.yml
    with:
      publish: true
    secrets: inherit      # optional code-signing credentials (docs/SIGNING.md)

  docker-test:
    uses: ./.github/workflows/docker.yml

  publish:
    name: attach to the release
    needs: standalone
    runs-on: ubuntu-latest
    permissions:
      contents: write        # the release assets
      id-token: write        # build provenance / SBOM attestations
      attestations: write
    steps:
      - uses: actions/checkout@v7   # first, so the clean checkout doesn't wipe the artifacts below
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Name the release assets, SHA256SUMS
        run: |
          set -e
          mkdir out
          for arch in x64 arm64; do
            cp "artifacts/ser2net-linux-$arch/ser2net" "out/ser2net-linux-$arch"
            chmod +x "out/ser2net-linux-$arch"
            cp "artifacts/meta-linux-$arch/THIRD-PARTY-LICENSES.txt" "out/ser2net-linux-$arch.THIRD-PARTY-LICENSES.txt"
            cp "artifacts/meta-linux-$arch/ser2net.cdx.json" "out/ser2net-linux-$arch.cdx.json"
          done
          cp artifacts/ser2net-windows-x64/ser2net.exe out/ser2net-windows-x64.exe
          cp artifacts/meta-windows-x64/THIRD-PARTY-LICENSES.txt out/ser2net-windows-x64.THIRD-PARTY-LICENSES.txt
          cp artifacts/meta-windows-x64/ser2net.cdx.json out/ser2net-windows-x64.cdx.json
          cd out
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Every platform ships the same supported CPython/OpenSSL
        run: python3 tools/release_guard.py sboms out/*.cdx.json --min-openssl 3.5
      - name: Build provenance attestation (gh attestation verify <file> -R ${{ github.repository }})
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            out/ser2net-linux-x64
            out/ser2net-linux-arm64
            out/ser2net-windows-x64.exe
      - name: SBOM attestation (Linux x64)
        uses: actions/attest-sbom@v4
        with:
          subject-path: out/ser2net-linux-x64
          sbom-path: out/ser2net-linux-x64.cdx.json
      - name: SBOM attestation (Linux arm64)
        uses: actions/attest-sbom@v4
        with:
          subject-path: out/ser2net-linux-arm64
          sbom-path: out/ser2net-linux-arm64.cdx.json
      - name: SBOM attestation (Windows x64)
        uses: actions/attest-sbom@v4
        with:
          subject-path: out/ser2net-windows-x64.exe
          sbom-path: out/ser2net-windows-x64.cdx.json
      - uses: softprops/action-gh-release@v3
        with:
          files: out/*
          fail_on_unmatched_files: true

  image:
    name: push the image to GHCR (amd64 + arm64)
    # also needs the standalone build (incl. Windows signing) to pass, so a failed exe
    # release doesn't still push the image and leave a split release
    needs: [docker-test, standalone]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/ser2net
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=ser2net
            org.opencontainers.image.description=Serial-to-network bridge with a web UI
            org.opencontainers.image.licenses=AGPL-3.0-only
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/ser2net
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
