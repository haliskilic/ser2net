name: Release

# On a v* tag (git tag -a v2.8.0 -m "..." && git push origin v2.8.0): check the tag (vX.Y.Z
# or vX.Y.Z-rc.N, equal to "v" + app.__version__, with a dated CHANGELOG section, on a
# commit of main), then run the whole CI on the tagged commit (ci.yml: lint, types, the
# test suites, the dependency audit, the Docker image and the standalone executables for
# Linux x86_64 + arm64 and Windows x64 with every check on them — bundle contents,
# empty-PATH run, clean AlmaLinux/Debian/Ubuntu/Fedora/openSUSE containers, the Windows
# service), and only when all of it passed publish: the release assets with SHA256SUMS,
# SBOMs, license texts and build provenance, and the image on GHCR. The write
# permissions belong to the publish jobs alone.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time, never cancelled: a second tag waits for the first. A group of
# its own (ci.yml's runs, also the one this workflow calls, use ci-<run>).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Before anything is built, so a mis-versioned tag fails in seconds instead of shipping
  # binaries, SBOMs and an image that carry another version
  verify:
    name: check the tag (version, CHANGELOG, on main)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0          # main's history, for the ancestry check
          persist-credentials: false
      - name: The tag is "v" + app.__version__, with a dated CHANGELOG.md section
        run: python3 tools/release_guard.py tag "$GITHUB_REF_NAME"
      - name: The tagged commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not a commit of main"; exit 1; }

  # Every check a pull request gets (what ci-ok gates merges on), on the tagged commit:
  # the checks that don't block a merge (Docker, arm64, the distributions, the audit)
  # can't fail for the first time after half the release is out. Its standalone job
  # builds the released executables (publish: signed when configured, docs/SIGNING.md).
  ci:
    needs: verify
    permissions:
      contents: read
      actions: read       # standalone.yml requests it (SignPath); the caller must grant it
    uses: ./.github/workflows/ci.yml
    with:
      publish: true
    secrets:              # the optional code-signing credentials (docs/SIGNING.md), no others
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

  publish:
    name: attach to the release
    needs: [verify, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # the release assets
      id-token: write        # build provenance / SBOM attestations
      attestations: write
    steps:
      # first, so the clean checkout doesn't wipe the artifacts below
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # the executables and their license texts / SBOMs (not CI's reports)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: ser2net-*
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: meta-*
          path: artifacts
      - name: Name the release assets, SHA256SUMS
        run: |
          set -e
          mkdir out
          for arch in x64 arm64; do
            cp "artifacts/ser2net-linux-$arch/ser2net" "out/ser2net-linux-$arch"
            chmod +x "out/ser2net-linux-$arch"
            cp "artifacts/meta-linux-$arch/THIRD-PARTY-LICENSES.txt" "out/ser2net-linux-$arch.THIRD-PARTY-LICENSES.txt"
            cp "artifacts/meta-linux-$arch/ser2net.cdx.json" "out/ser2net-linux-$arch.cdx.json"
          done
          cp artifacts/ser2net-windows-x64/ser2net.exe out/ser2net-windows-x64.exe
          cp artifacts/meta-windows-x64/THIRD-PARTY-LICENSES.txt out/ser2net-windows-x64.THIRD-PARTY-LICENSES.txt
          cp artifacts/meta-windows-x64/ser2net.cdx.json out/ser2net-windows-x64.cdx.json
          cd out
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Every platform ships the same supported CPython/OpenSSL
        run: python3 tools/release_guard.py sboms out/*.cdx.json --min-openssl 3.5
      - name: Build provenance attestation (gh attestation verify <file> -R ${{ github.repository }})
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            out/ser2net-linux-x64
            out/ser2net-linux-arm64
            out/ser2net-windows-x64.exe
      - name: SBOM attestation (Linux x64)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e  # v4.1.0
        with:
          subject-path: out/ser2net-linux-x64
          sbom-path: out/ser2net-linux-x64.cdx.json
      - name: SBOM attestation (Linux arm64)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e  # v4.1.0
        with:
          subject-path: out/ser2net-linux-arm64
          sbom-path: out/ser2net-linux-arm64.cdx.json
      - name: SBOM attestation (Windows x64)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e  # v4.1.0
        with:
          subject-path: out/ser2net-windows-x64.exe
          sbom-path: out/ser2net-windows-x64.cdx.json
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4  # zizmor: ignore[superfluous-actions]
        with:
          files: out/*
          fail_on_unmatched_files: true

  image:
    name: push the image to GHCR (amd64 + arm64)
    needs: [verify, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/ser2net
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=ser2net
            org.opencontainers.image.description=Serial-to-network bridge with a web UI
            org.opencontainers.image.licenses=AGPL-3.0-only
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/ser2net
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
