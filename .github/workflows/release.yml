name: Release

# On a v* tag (git tag -a v2.7.1 -m "..." && git push origin v2.7.1): build the
# standalone executables (no Python or anything else needed), run every standalone
# check on them — bundle contents, empty-PATH run, clean AlmaLinux/Debian/Ubuntu/
# Fedora/openSUSE containers, Windows — and only then attach them to the Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  standalone:
    uses: ./.github/workflows/standalone.yml
    with:
      publish: true
