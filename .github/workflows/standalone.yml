name: Standalone

# Builds the standalone executables and proves they need nothing else installed
# (tests/test_standalone.py), on Linux x86_64 + arm64 and Windows x64, and uploads them
# (+ license texts and SBOMs) as artifacts. Called by ci.yml for pull requests / main
# and by release.yml on a v* tag, whose own publish job attaches them to the release
# only after every check here has passed. With publish (release.yml) the Windows exe is
# code-signed when a signing service is configured (docs/SIGNING.md). This workflow
# only needs read access, so CI runs it with least privilege.
on:
  workflow_call:
    inputs:
      publish:
        description: A release build (sign the Windows exe when configured)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux:
    # the x64 job keeps its original name: it is a required check on main
    name: ${{ matrix.arch == 'x64' && 'build linux (glibc 2.28 baseline)' || 'build linux arm64 (glibc 2.28 baseline)' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - name: Build inside AlmaLinux 8 (glibc 2.28) with python-build-standalone
        run: |
          docker run --rm -v "$PWD:/src" -w /src almalinux:8 bash tools/build_standalone_linux.sh
          sudo chown -R "$(id -u):$(id -g)" dist build
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test-side dependencies
        run: pip install -r requirements.txt cryptography pyelftools
      - name: Bundle contents, empty-PATH run, loaded libraries
        env:
          SER2NET_STANDALONE_BIN: dist/ser2net
        run: python tests/test_standalone.py
      - uses: actions/upload-artifact@v7
        with:
          name: ser2net-linux-${{ matrix.arch }}
          path: dist/ser2net
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: meta-linux-${{ matrix.arch }}
          path: |
            build/THIRD-PARTY-LICENSES.txt
            build/ser2net.cdx.json
          if-no-files-found: error

  linux-distros:
    name: linux ${{ matrix.arch }} on ${{ matrix.image }}
    needs: linux
    runs-on: ${{ matrix.arch == 'x64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        image: ["almalinux:8", "debian:11", "ubuntu:20.04", "almalinux:9", "ubuntu:22.04",
                "debian:12", "opensuse/leap:15.6", "ubuntu:24.04", "fedora:latest"]  # glibc 2.28 -> newest
        # the distribution's CA bundle path, for base images that ship without ca-certificates
        include:
          - { image: "almalinux:8", ca: /etc/pki/tls/certs/ca-bundle.crt }
          - { image: "debian:11", ca: /etc/ssl/certs/ca-certificates.crt }
          - { image: "ubuntu:20.04", ca: /etc/ssl/certs/ca-certificates.crt }
          - { image: "almalinux:9", ca: /etc/pki/tls/certs/ca-bundle.crt }
          - { image: "ubuntu:22.04", ca: /etc/ssl/certs/ca-certificates.crt }
          - { image: "debian:12", ca: /etc/ssl/certs/ca-certificates.crt }
          - { image: "opensuse/leap:15.6", ca: /etc/ssl/ca-bundle.pem }
          - { image: "ubuntu:24.04", ca: /etc/ssl/certs/ca-certificates.crt }
          - { image: "fedora:latest", ca: /etc/pki/tls/certs/ca-bundle.crt }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ser2net-linux-${{ matrix.arch }}
          path: dist
      - run: chmod +x dist/ser2net
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt cryptography
      - name: Runs in a clean ${{ matrix.image }} container (no Python, no openssl, empty PATH)
        env:
          SER2NET_STANDALONE_BIN: dist/ser2net
          SER2NET_STANDALONE_IMAGE: ${{ matrix.image }}
          SER2NET_STANDALONE_CA: ${{ matrix.ca }}
        run: python tests/test_standalone.py

  windows:
    name: build windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Dependencies (incl. MQTT/LDAP/OIDC + cryptography), PyInstaller, test-side pefile
        run: pip install -r requirements.txt -r requirements-optional.txt pyinstaller==6.22.3 pefile
      - name: Build (with the license texts and SBOM of every bundled component)
        run: |
          python tools/third_party.py licenses build/THIRD-PARTY-LICENSES.txt --strict
          python tools/third_party.py sbom build/ser2net.cdx.json --strict
          pyinstaller --clean --noconfirm ser2net.spec

      # ---- code signing (releases only, when configured; docs/SIGNING.md) ----
      - name: Sign with Azure Trusted Signing
        if: inputs.publish && vars.WINDOWS_SIGNING == 'azure'
        uses: azure/trusted-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\ser2net.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Upload the unsigned exe for SignPath
        id: unsigned
        if: inputs.publish && vars.WINDOWS_SIGNING == 'signpath'
        uses: actions/upload-artifact@v7
        with:
          name: ser2net-windows-x64-unsigned
          path: dist/ser2net.exe
          if-no-files-found: error
      - name: Sign with SignPath
        if: inputs.publish && vars.WINDOWS_SIGNING == 'signpath'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          connector-url: https://githubactions.connector.signpath.io
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Use the SignPath-signed exe
        if: inputs.publish && vars.WINDOWS_SIGNING == 'signpath'
        shell: pwsh
        run: Copy-Item signed\ser2net.exe dist\ser2net.exe -Force
      - name: Verify the Authenticode signature
        if: inputs.publish && vars.WINDOWS_SIGNING != ''
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature dist\ser2net.exe
          "$($sig.Status): $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "dist\ser2net.exe is not validly signed: $($sig.StatusMessage)" }

      - name: Bundle contents, empty-PATH run, loaded libraries
        env:
          SER2NET_STANDALONE_BIN: dist/ser2net.exe
        run: python tests/test_standalone.py
      - name: Windows service — install, crash restart, stop, uninstall (the exe)
        env:
          SER2NET_STANDALONE_BIN: dist/ser2net.exe
          SER2NET_SERVICE_TESTS: "1"
        run: python tests/test_windows_service.py
      - uses: actions/upload-artifact@v7
        with:
          name: ser2net-windows-x64
          path: dist/ser2net.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: meta-windows-x64
          path: |
            build/THIRD-PARTY-LICENSES.txt
            build/ser2net.cdx.json
          if-no-files-found: error
