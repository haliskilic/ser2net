name: Standalone

# Builds the standalone executables and proves they need nothing else installed
# (tests/test_standalone.py), on Linux x86_64 + arm64 and Windows x64, and uploads them
# (+ license texts and SBOMs) as artifacts. Called by ci.yml, for pull requests / main
# and when release.yml runs ci.yml on a v* tag: release.yml's own publish job attaches
# them to the release only after every check has passed. With publish (a release) the
# Windows exe is code-signed when a signing service is configured (docs/SIGNING.md).
# This workflow only needs read access, so CI runs it with least privilege.
on:
  workflow_call:
    inputs:
      publish:
        description: A release build (sign the Windows exe when configured)
        type: boolean
        default: false
    secrets:  # code signing (docs/SIGNING.md); release.yml passes these, ci.yml none
      AZURE_TENANT_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      SIGNPATH_API_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      sign_dry_run:
        description: Exercise the Windows signing/verify steps with a self-signed test certificate
        type: boolean
        default: false

permissions:
  contents: read
  # the SignPath signing step hands GITHUB_TOKEN to its connector to read the run and
  # download the artifact, which needs Actions: read even on a public repo (the callers
  # in ci.yml / release.yml grant the same, or the run fails at start-up)
  actions: read

jobs:
  linux:
    # the x64 job keeps its original name: it is a required check on main
    name: ${{ matrix.arch == 'x64' && 'build linux (glibc 2.28 baseline)' || 'build linux arm64 (glibc 2.28 baseline)' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build inside AlmaLinux 8 (glibc 2.28) with python-build-standalone
        run: |
          docker run --rm -v "$PWD:/src" -w /src almalinux:8 bash tools/build_standalone_linux.sh
          sudo chown -R "$(id -u):$(id -g)" dist build
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Test-side dependencies
        run: pip install -r requirements.txt cryptography pyelftools
      - name: Bundle contents, empty-PATH run, loaded libraries
        env:
          SER2NET_STANDALONE_BIN: dist/ser2net
        run: python tests/test_standalone.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ser2net-linux-${{ matrix.arch }}
          path: dist/ser2net
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: meta-linux-${{ matrix.arch }}
          path: |
            build/THIRD-PARTY-LICENSES.txt
            build/ser2net.cdx.json
          if-no-files-found: error

  # The binary under systemd/ser2net-standalone.service on a real systemd (the runner's
  # PID 1): installed as the README says, data in /var/lib/ser2net (tests/systemd_smoke.sh)
  linux-systemd:
    name: systemd unit (binary)
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ser2net-linux-x64
          path: dist
      - name: Install and run systemd/ser2net-standalone.service
        timeout-minutes: 10
        run: tests/systemd_smoke.sh dist/ser2net

  # The binary installed by systemd/ser2net-install.sh from files laid out as a release has
  # them: fresh, again (an upgrade), a changed file, --uninstall, a noexec /tmp
  # (tests/install_smoke.sh)
  linux-install:
    name: install script (binary)
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ser2net-linux-x64
          path: dist
      - name: sudo sh ser2net-install.sh, as the README says
        timeout-minutes: 10
        run: tests/install_smoke.sh dist/ser2net

  linux-distros:
    name: linux ${{ matrix.arch }} on ${{ matrix.image }}
    needs: linux
    runs-on: ${{ matrix.arch == 'x64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        image: ["almalinux:8", "debian:11", "ubuntu:20.04", "almalinux:9", "ubuntu:22.04",
                "debian:12", "opensuse/leap:15.6", "ubuntu:24.04", "fedora:latest"]  # glibc 2.28 -> newest
        # the distribution's CA bundle path, for base images that ship without ca-certificates
        include:
          - { image: "almalinux:8", ca: /etc/pki/tls/certs/ca-bundle.crt }
          - { image: "debian:11", ca: /etc/ssl/certs/ca-certificates.crt }
          - { image: "ubuntu:20.04", ca: /etc/ssl/certs/ca-certificates.crt }
          - { image: "almalinux:9", ca: /etc/pki/tls/certs/ca-bundle.crt }
          - { image: "ubuntu:22.04", ca: /etc/ssl/certs/ca-certificates.crt }
          - { image: "debian:12", ca: /etc/ssl/certs/ca-certificates.crt }
          - { image: "opensuse/leap:15.6", ca: /etc/ssl/ca-bundle.pem }
          - { image: "ubuntu:24.04", ca: /etc/ssl/certs/ca-certificates.crt }
          - { image: "fedora:latest", ca: /etc/pki/tls/certs/ca-bundle.crt }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ser2net-linux-${{ matrix.arch }}
          path: dist
      - run: chmod +x dist/ser2net
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt cryptography
      - name: Runs in a clean ${{ matrix.image }} container (no Python, no openssl, empty PATH)
        env:
          SER2NET_STANDALONE_BIN: dist/ser2net
          SER2NET_STANDALONE_IMAGE: ${{ matrix.image }}
          SER2NET_STANDALONE_CA: ${{ matrix.ca }}
        run: python tests/test_standalone.py

  windows:
    name: build windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # runs the tests; the exe itself bundles PBS CPython
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Test-side dependencies (the app's own for the in-process checks, cryptography, pefile)
        run: pip install -r requirements.txt cryptography pefile
      - name: Build with python-build-standalone (supported OpenSSL), version resource + icon, SBOM
        shell: pwsh
        run: pwsh tools/build_standalone_windows.ps1

      # ---- code signing (releases only, when configured; docs/SIGNING.md) ----
      # A self-signed dry run (workflow_dispatch) exercises the version resource + the
      # Verify/copy steps on every change, without the signing account.
      - name: Create a self-signed code-signing certificate (dry run)
        id: dryrun
        if: github.event_name == 'workflow_dispatch' && inputs.sign_dry_run && vars.WINDOWS_SIGNING == ''
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=ser2net signing dry run" `
            -CertStoreLocation Cert:\CurrentUser\My -KeyUsage DigitalSignature -NotAfter (Get-Date).AddDays(1)
          $ts = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if (-not $ts) { $ts = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1).FullName }
          & $ts sign /fd SHA256 /sha1 $cert.Thumbprint dist\ser2net.exe
          # trust it on this runner only, so the Verify step below reports Valid
          Export-Certificate -Cert $cert -FilePath dryrun.cer | Out-Null
          Import-Certificate -FilePath dryrun.cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          "signed=true" >> $env:GITHUB_OUTPUT
      - name: Sign with Azure Artifact Signing
        if: inputs.publish && vars.WINDOWS_SIGNING == 'azure'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # v2.0.0 (was azure/trusted-signing-action)
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\ser2net.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Upload the unsigned exe for SignPath
        id: unsigned
        if: inputs.publish && vars.WINDOWS_SIGNING == 'signpath'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ser2net-windows-x64-unsigned
          path: dist/ser2net.exe
          if-no-files-found: error
      - name: Sign with SignPath
        if: inputs.publish && vars.WINDOWS_SIGNING == 'signpath'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092  # v3
        with:
          # connector-url: the action's default, which v3 moved to SignPath's Pipeline Connector
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          github-token: ${{ github.token }}   # needs the actions:read granted above
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # release policies usually need a manual approval, so wait well beyond the 600 s default
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signed
      - name: Use the SignPath-signed exe
        if: inputs.publish && vars.WINDOWS_SIGNING == 'signpath'
        shell: pwsh
        run: Copy-Item signed\ser2net.exe dist\ser2net.exe -Force
      - name: Verify the Authenticode signature
        if: (inputs.publish && vars.WINDOWS_SIGNING != '') || steps.dryrun.outputs.signed == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature dist\ser2net.exe
          "$($sig.Status): $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "dist\ser2net.exe is not validly signed: $($sig.StatusMessage)" }

      - name: Bundle contents, empty-PATH run, loaded libraries
        env:
          SER2NET_STANDALONE_BIN: dist/ser2net.exe
        run: python tests/test_standalone.py
      - name: Windows service — install, crash restart, stop, uninstall (the exe)
        env:
          SER2NET_STANDALONE_BIN: dist/ser2net.exe
          SER2NET_SERVICE_TESTS: "1"
        run: python tests/test_windows_service.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ser2net-windows-x64
          path: dist/ser2net.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: meta-windows-x64
          path: |
            build/THIRD-PARTY-LICENSES.txt
            build/ser2net.cdx.json
          if-no-files-found: error
