name: Distribution packages (nixpkgs, Void, Gentoo, FreeBSD, MacPorts)

# Builds the recipes in packaging/nix, packaging/void, packaging/gentoo, packaging/freebsd and
# packaging/macports the way each distribution does, from the release's git tag tarball,
# installs the result and runs it: ser2netweb --version, its service under the target's own
# init system (systemd in a NixOS VM, runit, OpenRC, rc.d, launchd) and /healthz
# (ser2netweb --healthcheck). Each tree is pinned: nixpkgs, void-packages, the Gentoo stage3
# and portage snapshot, the FreeBSD ports tree by commit or digest; MacPorts by its
# release's package (the ports tree is MacPorts' current one, as a user gets it).
#
# The job "recipes" checks every checksum against the tag's real tarball
# (tools/bump_recipes_2.py --check) and hands the recipes on. Run by hand with a tag, it
# moves them to that release first (tools/bump_recipes_2.py X.Y.Z), which tries a new
# release before its bump is committed. docs/PACKAGING.md: the recipes, the local builds
# and how each one is submitted.
#
# Not a merge condition: a workflow of its own that no required check names; a distribution
# tree that moves on breaks here first (weekly), not in a pull request of something else.
on:
  push:  # (only while the workflow isn't on main, which a dispatch needs; removed before merging)
    branches: [ch/p2b-distros]
  pull_request:
    paths:
      - "packaging/nix/**"
      - "packaging/void/**"
      - "packaging/gentoo/**"
      - "packaging/freebsd/**"
      - "packaging/macports/**"
      - "tools/bump_recipes_2.py"
      - "tests/test_distro_recipes_2.py"
      - ".github/workflows/distro-packages-2.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "A release tag (vX.Y.Z) to move the recipes to first; empty: as committed"
        required: false
        default: ""
  schedule:
    - cron: "17 4 * * 3"    # Wednesdays 04:17 UTC

permissions:
  contents: read

concurrency:
  group: distro-packages-2-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  recipes:
    name: recipes (checksums of the tag's tarball)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: The release the recipes build
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::the tag is vX.Y.Z, not $TAG"; exit 1
            fi
            version=${TAG#v}
            python3 tools/bump_recipes_2.py "$version"
          else
            version=$(sed -n 's/^  version = "\(.*\)";$/\1/p' packaging/nix/package.nix)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: The recipes agree with each other and with pyproject.toml
        run: python3 tests/test_distro_recipes_2.py
      - name: Every checksum against the tag's tarball
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 tools/bump_recipes_2.py "$VERSION" --check
      - name: A release newer than the recipes'
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [ "$latest" != "v$VERSION" ]; then
            echo "::warning::the recipes build v$VERSION, the newest release is $latest:" \
              "python3 tools/bump_recipes_2.py ${latest#v}"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: recipes
          path: |
            packaging/nix/
            packaging/void/
            packaging/gentoo/
            packaging/freebsd/
            packaging/macports/
          retention-days: 3

  nixpkgs:
    name: nixpkgs (nix-build, NixOS VM test)
    needs: recipes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.recipes.outputs.version }}
      # nixos-unstable on 2026-11-11
      NIXPKGS: https://github.com/NixOS/nixpkgs/archive/d4f25a3e562008648d45bcf2d70bcc7422cad84e.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: recipes
          path: packaging
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702  # v31.11.2
        with:
          extra_nix_config: |
            sandbox = true
            system-features = nixos-test benchmark big-parallel kvm
      - name: nix-build the package (its build checks the imports and --version)
        run: |
          nix-build -I "nixpkgs=$NIXPKGS" --out-link result \
            -E 'with import <nixpkgs> {}; callPackage ./packaging/nix/package.nix {}'
          ./result/bin/ser2netweb --version | grep -Fx "ser2netweb $VERSION"
          ./result/bin/ser2netweb --about
      - name: nixfmt (nixpkgs' formatting)
        run: nix-shell -I "nixpkgs=$NIXPKGS" -p nixfmt --run 'nixfmt --check packaging/nix/*.nix'
      - name: The NixOS module in a VM (systemd, /healthz, --set-password, reload)
        run: nix-build -I "nixpkgs=$NIXPKGS" packaging/nix/ci.nix -A test --no-out-link

  void:
    name: Void Linux (xbps-src, runit)
    needs: recipes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      # xbps-src's chroot (xbps-uchroot) needs the privileges, as in void-packages' own CI
      image: ghcr.io/void-linux/void-glibc-full:20261101R1@sha256:e98f8cdde9e6ca85f8542fad5cdd06032a05dca3bf2b81757949bb24d67afa37
      options: --privileged
      volumes:
        - /dev:/dev
    env:
      VERSION: ${{ needs.recipes.outputs.version }}
      VOID_PACKAGES: 1dcf4195c82ff225310dcfa4ffd6a15e5e294633  # master on 2026-11-13
    steps:
      - name: Prepare the container
        run: |
          xbps-install -Syu xbps && xbps-install -yu
          xbps-install -y bash curl git sudo xtools
          useradd -G xbuilder -M builder
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: recipes
          path: packaging
      - name: void-packages at the pinned commit, with the templates
        run: |
          git init -q /void-packages
          git -C /void-packages fetch -q --depth 1 https://github.com/void-linux/void-packages.git "$VOID_PACKAGES"
          git -C /void-packages checkout -q FETCH_HEAD
          cp -R packaging/void/srcpkgs/. /void-packages/srcpkgs/
          echo XBPS_CHROOT_CMD=uchroot >> /void-packages/etc/conf
          chown -R builder:builder /void-packages
      - name: xlint
        working-directory: /void-packages
        run: |
          for t in ser2netweb python3-pyserial-asyncio-fast python3-python-multipart; do
            xlint "srcpkgs/$t/template"
          done
      - name: xbps-src binary-bootstrap
        working-directory: /void-packages
        run: sudo -Eu builder ./xbps-src binary-bootstrap
      - name: xbps-src pkg, with the check phase (as void-packages' CI on x86_64)
        working-directory: /void-packages
        run: |
          for p in python3-python-multipart python3-pyserial-asyncio-fast ser2netweb; do
            sudo -Eu builder ./xbps-src -Q pkg "$p"
          done
      - name: xbps-install, run the runit service
        working-directory: /void-packages
        run: |
          xbps-install -Sy -R "$PWD/hostdir/binpkgs" ser2netweb
          xbps-query -f ser2netweb | grep -E '^/etc/sv/|/bin/'
          ser2netweb --version | grep -Fx "ser2netweb $VERSION"
          ser2netweb --about
          id _ser2netweb | grep -F '(dialout)'
          test "$(stat -c %U:%a /var/lib/ser2netweb)" = _ser2netweb:700
          (cd /etc/sv/ser2netweb && exec ./run) > "$RUNNER_TEMP/runit.log" 2>&1 &
          pid=$!
          ok=
          for _ in $(seq 60); do
            if ser2netweb --healthcheck --data-dir /var/lib/ser2netweb; then ok=1; break; fi
            sleep 1
          done
          kill "$pid"
          cat "$RUNNER_TEMP/runit.log"
          test -n "$ok"

  gentoo:
    name: Gentoo (GURU overlay, emerge, OpenRC)
    needs: recipes
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.recipes.outputs.version }}
      STAGE3: gentoo/stage3:20261109@sha256:8265c49eb2dd5c503965ac339dc553fd75f477a6b62162345f6bddbfa28353de
      PORTAGE: gentoo/portage:20261112@sha256:95b5c08a2f5211054c8f093ab137b4f7154c76a82df5a2ae90a66641920bd65d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: recipes
          path: packaging
      - name: The stage3 with the pinned portage snapshot
        run: |
          docker create --name portage "$PORTAGE" /bin/true
          # (--init: something has to reap the stopped service, as init does)
          docker run -d --init --name gentoo --volumes-from portage \
            -v "$PWD/packaging/gentoo:/src:ro" "$STAGE3" sleep infinity
      - name: The recipes as an overlay (GURU's layout), binary packages for the rest
        run: |
          docker exec -i gentoo bash -euxo pipefail <<'EOF'
          overlay=/var/db/repos/ser2netweb
          mkdir -p "$overlay"
          cp -R /src/. "$overlay/"
          mkdir -p "$overlay/profiles" "$overlay/metadata"
          echo ser2netweb > "$overlay/profiles/repo_name"
          printf '%s\n' 'masters = gentoo' 'thin-manifests = true' 'sign-manifests = false' \
            > "$overlay/metadata/layout.conf"
          mkdir -p /etc/portage/repos.conf /etc/portage/package.accept_keywords
          # (pkgcheck reads /etc/portage/repos.conf alone: ::gentoo is to be named there too)
          cp /usr/share/portage/config/repos.conf /etc/portage/repos.conf/gentoo.conf
          printf '[ser2netweb]\nlocation = %s\n' "$overlay" > /etc/portage/repos.conf/ser2netweb.conf
          # GURU is ~arch only; so are a few of the dependencies
          printf '%s\n' '*/*::ser2netweb ~amd64' 'dev-python/starlette ~amd64' \
            'dev-python/websockets ~amd64' 'dev-python/python-multipart ~amd64' \
            > /etc/portage/package.accept_keywords/ser2netweb
          echo 'FEATURES="${FEATURES} getbinpkg -test"' >> /etc/portage/make.conf
          echo 'EMERGE_DEFAULT_OPTS="--jobs=4 --quiet-build=y"' >> /etc/portage/make.conf
          getuto
          emerge --info | head -n 30
          EOF
      - name: emerge --oneshot net-misc/ser2netweb (USE=-test)
        run: |
          docker exec -i gentoo bash -euxo pipefail <<'EOF'
          USE=-test emerge --oneshot --verbose net-misc/ser2netweb
          EOF
      - name: pkgcheck scan
        run: |
          docker exec -i gentoo bash -euxo pipefail <<'EOF'
          emerge --oneshot dev-util/pkgcheck
          cd /var/db/repos/ser2netweb
          pkgcheck scan --exit error
          EOF
      - name: Run it, and its OpenRC service
        run: |
          docker exec -i -e VERSION gentoo bash -euxo pipefail <<'EOF'
          ser2netweb --version | grep -Fx "ser2netweb $VERSION"
          ser2netweb --about
          id ser2netweb | grep -F '(dialout)'
          test "$(stat -c %U:%a /var/lib/ser2netweb)" = ser2netweb:700
          test -f /usr/lib/systemd/system/ser2netweb.service
          # OpenRC without booting it (a container): the run level it would be in
          mkdir -p /run/openrc && touch /run/openrc/softlevel
          /etc/init.d/ser2netweb --nodeps start
          ok=
          for _ in $(seq 60); do
            if ser2netweb --healthcheck --data-dir /var/lib/ser2netweb; then ok=1; break; fi
            sleep 1
          done
          test -n "$ok"
          /etc/init.d/ser2netweb --nodeps reload
          sleep 2
          ser2netweb --healthcheck --data-dir /var/lib/ser2netweb
          /etc/init.d/ser2netweb --nodeps stop
          EOF

  freebsd:
    name: FreeBSD ports (make package, portlint, rc.d)
    needs: recipes
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: recipes
          path: packaging
      - uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc  # v1.5.9
        env:
          PORTS_COMMIT: 5f37287767a4af77fa91ddbc314235709caa9b47  # main on 2026-11-13
          VERSION: ${{ needs.recipes.outputs.version }}
        with:
          release: "14.5"
          copyback: false
          envs: PORTS_COMMIT VERSION
          run: |
            set -ex -o pipefail
            freebsd-version
            src="$PWD/packaging/freebsd"
            # the binary packages of the ports' head, for the dependencies
            mkdir -p /usr/local/etc/pkg/repos
            echo 'FreeBSD: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest" }' \
              > /usr/local/etc/pkg/repos/FreeBSD.conf
            pkg install -y git-tiny portlint
            # the ports tree at the pinned commit: the framework and the dependencies' ports
            git init -q /usr/ports
            cd /usr/ports
            git config core.sparseCheckout true
            printf '%s\n' /Mk/ /Templates/ /Keywords/ /UIDs /GIDs /MOVED /LEGAL /net/Makefile \
              '/lang/python*/' /ports-mgmt/pkg/ \
              /comms/py-pyserial/ /comms/py-pyserial-asyncio-fast/ /www/py-starlette/ \
              /www/py-uvicorn/ /www/py-python-multipart/ /net/py-h11/ /devel/py-websockets/ \
              /devel/py-Jinja2/ /textproc/py-markupsafe/ /sysutils/py-psutil/ \
              /devel/py-setuptools/ /devel/py-wheel/ /devel/py-build/ /devel/py-installer/ \
              /net/py-ldap3/ /net/py-paho-mqtt/ /security/py-authlib/ \
              /security/py-cryptography/ > .git/info/sparse-checkout
            git fetch -q --depth 1 --filter=blob:none \
              https://github.com/freebsd/freebsd-ports.git "$PORTS_COMMIT"
            git checkout -q FETCH_HEAD
            # the port's user and group, as the submission adds them (sorted by id)
            for f in UIDs GIDs; do
              awk -F: 'NR == FNR { line[$1] = $0; id[$1] = $3 + 0; next }
                !/^#/ && NF {
                  for (n in line) if (!(n in done) && id[n] < $3 + 0) { print line[n]; done[n] = 1 }
                  if ($1 in line) { print line[$1]; done[$1] = 1; next }
                }
                { print }
                END { for (n in line) if (!(n in done)) print line[n] }' "$src/$f" "$f" > "$f.new"
              mv "$f.new" "$f"
            done
            grep -n '^ser2netweb:\|^dialer:' UIDs GIDs
            cp -R "$src/net/ser2netweb" net/
            cd net/ser2netweb
            flavor=$(make -V PY_FLAVOR)
            pkg install -y $(for p in setuptools wheel build installer h11 Jinja2 markupsafe \
              psutil pyserial pyserial-asyncio-fast python-multipart starlette uvicorn \
              websockets ldap3 paho-mqtt authlib cryptography; do echo "$flavor-$p"; done)
            echo DEVELOPER=yes >> /etc/make.conf
            git -C /usr/ports add --sparse -f net/ser2netweb   # (portlint -C: the port is in the tree)
            portlint -AC
            make DEVELOPER=yes BATCH=yes package
            make DEVELOPER=yes check-plist
            make test
            pkg add "work/pkg/ser2netweb-$VERSION.pkg"
            pkg info -l ser2netweb | grep -E 'rc.d|bin/'
            ser2netweb --version | grep -Fx "ser2netweb $VERSION"
            ser2netweb --about
            id ser2netweb | grep -F '(dialer)'
            sysrc ser2netweb_enable=YES
            service ser2netweb start
            ok=
            for i in $(seq 60); do
              if ser2netweb --healthcheck --data-dir /var/db/ser2netweb; then ok=1; break; fi
              sleep 1
            done
            test -n "$ok"
            stat -f '%Su:%Lp' /var/db/ser2netweb | grep -Fx ser2netweb:700
            service ser2netweb reload
            sleep 2
            service ser2netweb status
            ser2netweb --healthcheck --data-dir /var/db/ser2netweb
            service ser2netweb stop

  macports:
    name: MacPorts (port install, port lint, launchd)
    needs: recipes
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.recipes.outputs.version }}
      MACPORTS_VERSION: 2.12.7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: recipes
          path: packaging
      - name: Install MacPorts (its release's package, checked by SHA-256)
        run: |
          # (from MacPorts-2.12.7.chk.txt of the release)
          case "$(sw_vers -productVersion | cut -d. -f1)" in
            15) os=15-Sequoia; sum=87b2e87ed7adc4aca947b42eb7ff991614cc0edfccb486237f2bbc75f28aae63 ;;
            26) os=26-Tahoe; sum=588f14ccd3c6199559a070a80e6cddd6871721a08cc434775bf54378fd667910 ;;
            27) os=27-GoldenGate; sum=e81cc182808a7c94f72a2121c7c7cabc9f135b88b9a88d477635f0912826da7e ;;
            *) echo "::error::no MacPorts $MACPORTS_VERSION package listed for $(sw_vers -productVersion)"; exit 1 ;;
          esac
          pkg="$RUNNER_TEMP/MacPorts-$MACPORTS_VERSION-$os.pkg"
          curl -fsSL -o "$pkg" \
            "https://github.com/macports/macports-base/releases/download/v$MACPORTS_VERSION/MacPorts-$MACPORTS_VERSION-$os.pkg"
          echo "$sum  $pkg" | shasum -a 256 -c -
          sudo installer -pkg "$pkg" -target /
          echo /opt/local/bin >> "$GITHUB_PATH"
          echo /opt/local/sbin >> "$GITHUB_PATH"
      - name: The ports tree, and the recipes as a local repository before it
        run: |
          sudo port -N selfupdate
          local=/opt/local/var/ser2netweb-ports
          sudo mkdir -p "$local"
          sudo cp -R packaging/macports/. "$local/"
          (cd "$local" && sudo portindex)
          conf=/opt/local/etc/macports/sources.conf
          { echo "file://$local [nosync]"; cat "$conf"; } > "$RUNNER_TEMP/sources.conf"
          sudo cp "$RUNNER_TEMP/sources.conf" "$conf"
          port info ser2netweb py314-pyserial-asyncio-fast
      - name: port lint --nitpick
        run: port lint --nitpick ser2netweb py-pyserial-asyncio-fast
      - name: port install ser2netweb
        run: sudo port -N -v install ser2netweb
      - name: Run it, and its launchd startup item
        run: |
          ser2netweb --version | grep -Fx "ser2netweb $VERSION"
          ser2netweb --about
          dscl . -read /Users/_ser2netweb UniqueID
          test "$(sudo stat -f %Su:%Lp /opt/local/var/db/ser2netweb)" = _ser2netweb:700
          sudo port load ser2netweb
          ok=
          for _ in $(seq 60); do
            if sudo /opt/local/bin/ser2netweb --healthcheck --data-dir /opt/local/var/db/ser2netweb; then ok=1; break; fi
            sleep 2
          done
          sudo launchctl list | grep -F ser2netweb || true
          test -n "$ok"
          sudo port unload ser2netweb
