# Dependabot: weekly version-update PRs (grouped, one per ecosystem) plus security
# updates. It updates requirements.txt and the hash locks (requirements-lock.txt,
# requirements-build.txt) itself; the offline wheels follow through
# .github/workflows/refresh-pins.yml, which pushes them onto the Dependabot branch and
# re-runs CI (until then only the job "offline wheels match requirements.txt" is red).
# See CONTRIBUTING.md.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
  # the browser libraries vendored in app/web/static (vendor/npm/package.json records
  # them; .github/workflows/refresh-pins.yml copies a bumped release's files in). A major
  # version (xterm.js 6, htmx 4) changes the console / the pages: done by hand.
  - package-ecosystem: npm
    directory: /vendor/npm
    schedule:
      interval: weekly
    groups:
      browser:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
