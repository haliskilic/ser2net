# Dependabot: weekly version-update PRs (grouped, one per ecosystem, except the libraries
# ser2netweb carries fixes for, below) plus security updates. It updates requirements.txt
# and the hash locks (requirements-lock.txt, requirements-build.txt) itself; the offline
# wheels follow through .github/workflows/refresh-pins.yml, which pushes them onto the
# Dependabot branch and re-runs CI (until then only the job "offline wheels match
# requirements.txt" is red). See CONTRIBUTING.md.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]
        # one pull request each: ser2netweb carries fixes for pyserial / pyserial-asyncio-fast
        # code (ser2netweb/engine/serial_compat.py), and ldap3 / pyasn1 bumps need their own look
        # (CONTRIBUTING.md, "Third-party code")
        exclude-patterns: ["pyserial", "pyserial-asyncio-fast", "ldap3", "pyasn1"]
    commit-message:
      prefix: "deps"
  # the browser libraries vendored in ser2netweb/web/static (vendor/npm/package.json records
  # them; .github/workflows/refresh-pins.yml copies a bumped release's files in). A major
  # version (xterm.js 7, htmx 4) changes the console / the pages: done by hand. xterm.js
  # and its addons are released together (the addons are 0.x: a minor each time), and this
  # group bumps them in one pull request; an addon proposed without its xterm.js (when that
  # one is a major) is refused by tools/refresh_assets.py and stays red: close it, and do
  # both with the major.
  - package-ecosystem: npm
    directory: /vendor/npm
    schedule:
      interval: weekly
    groups:
      browser:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
