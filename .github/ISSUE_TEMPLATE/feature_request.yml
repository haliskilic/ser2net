name: Özellik isteği / Feature request
description: Yeni bir özellik ya da iyileştirme önerin. / Suggest a new feature or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Hangi sorunu çözüyor? / What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Öneri / Proposal
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Ortam ve cihazlar / Environment and devices
      description: Örneğin seri cihaz, protokol, ağ yapısı. / E.g. serial device, protocol, network layout.
