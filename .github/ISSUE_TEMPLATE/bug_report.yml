name: Hata bildirimi / Bug report
description: Bir şey çalışmıyor ya da beklenenden farklı çalışıyor. / Something doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Güvenlik açığı bildirmek için bu formu **kullanmayın**; bkz. [SECURITY.md](https://github.com/haliskilic/ser2net/blob/main/SECURITY.md).
        Do **not** use this form for security vulnerabilities — see [SECURITY.md](https://github.com/haliskilic/ser2net/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: Ne oldu? / What happened?
      description: Beklenen ve gerçekleşen davranış. / Expected vs. actual behaviour.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Nasıl tekrarlanır? / Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: about
    attributes:
      label: "`ser2net --about` çıktısı / output"
      description: "Sürüm, işletim sistemi ve bileşenler. Bilinen klasörler kısaltılır (`<python>`, `<ser2net>`, `~`); kalan yollarda hesap adınız görünebilir, göndermeden önce bakın. / Version, OS and components. Known folders are shortened (`<python>`, `<ser2net>`, `~`); other paths can show your account name, so check before posting."
      render: text
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Kurulum / Installation
      options:
        - Standalone binary (Windows .exe)
        - Standalone binary (Linux)
        - Docker
        - Kaynak / source (python ser2net.py)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: "`data/all.log` ve ilgili eşlemenin log'undan ilgili satırlar. Göndermeden önce bakın: log'larda IP adresleri, kullanıcı adları ve host adı vardır; bunları biçimi koruyarak maskeleyin (ör. 10.0.x.x, user1). Parola, API token'ı ya da cluster anahtarını asla yapıştırmayın. / Relevant lines from data/all.log and the mapping's log. Check before posting: logs show IP addresses, user names and the host name; mask them, keeping the format (e.g. 10.0.x.x, user1). Never paste passwords, the API token or the cluster key."
      render: text
