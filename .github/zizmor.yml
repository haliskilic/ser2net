# zizmor: the GitHub Actions security linter (CI job "workflow lint (zizmor)").
# https://docs.zizmor.sh/configuration/
rules:
  unpinned-uses:
    config:
      policies:
        # GitHub's own actions by version tag; every other action by full commit SHA,
        # with the version in a comment (Dependabot updates both)
        "actions/*": ref-pin
        "*": hash-pin
  # suggests '$/' for this repository's own reusable workflows; './' is the same
  # commit's file either way
  self-repository:
    disable: true
  # a cooldown (days before Dependabot proposes a new release) is a Dependabot policy
  # decision, not made here yet
  dependabot-cooldown:
    disable: true
