# Optional drop-in for ser2net.service (ser2net 2.9.0 or newer): systemd counts ser2net as
# started only once its mappings run and its admin UI listens, and restarts it when its
# event loop stops answering. Not part of the default unit: an older ser2net never says it
# is ready, so with this file it would fail to start (remove it before a downgrade).
#
#   sudo mkdir -p /etc/systemd/system/ser2net.service.d
#   sudo cp systemd/ser2net.service.d/notify.conf /etc/systemd/system/ser2net.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart ser2net
#
# (For another unit name, e.g. ser2net-standalone.service, use that name's .d folder.)
[Service]
Type=notify
# "all": the standalone binary runs ser2net in a child process of its launcher
NotifyAccess=all
# opening many serial ports can take a while; ser2net reports READY=1 once it is done
TimeoutStartSec=300
# ser2net pings every 60 s while its event loop runs (WATCHDOG=1); without a ping for
# 120 s systemd stops it with SIGABRT and Restart=on-failure starts it again. ser2net's
# own watchdog (SER2NETWEB_LOOP_WATCHDOG, 90 s) usually ends it first, with a hang.log.
WatchdogSec=120
