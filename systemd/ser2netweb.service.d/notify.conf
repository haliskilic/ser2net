# Optional drop-in for ser2netweb.service (2.9.0 or newer, ser2net up to 2.9.x): systemd
# counts ser2netweb as started only once its mappings run and its admin UI listens, and
# restarts it when its event loop stops answering. Not part of the default unit: a release
# before 2.9.0 never says it is ready, so with this file it would fail to start (remove it
# before such a downgrade).
#
#   sudo mkdir -p /etc/systemd/system/ser2netweb.service.d
#   sudo cp systemd/ser2netweb.service.d/notify.conf /etc/systemd/system/ser2netweb.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart ser2netweb
#
# (For another unit name use that name's .d folder: ser2netweb@.service.d for the template's
# instances. The binary's unit is installed as ser2netweb.service, so it uses this one.)
[Service]
Type=notify
# "all": the standalone binary runs ser2netweb in a child process of its launcher
NotifyAccess=all
# opening many serial ports can take a while; ser2netweb reports READY=1 once it is done
TimeoutStartSec=300
# ser2netweb pings every 60 s while its event loop runs (WATCHDOG=1); without a ping for
# 120 s systemd stops it with SIGABRT and Restart=on-failure starts it again. ser2netweb's
# own watchdog (SER2NETWEB_LOOP_WATCHDOG, 90 s) usually ends it first, with a hang.log.
WatchdogSec=120
