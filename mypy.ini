# mypy configuration for ser2net (CI job "mypy"; run locally with: mypy)
[mypy]
python_version = 3.10
files = app, ser2net.py, bootstrap.py, tools
# optional / platform-specific packages without type information
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
strict_equality = True
check_untyped_defs = True

# Fully annotated modules: a new function there needs its types. Extend this module by
# module (app.web.routes.* and app.web.api next) as the route handlers get annotated.
[mypy-app.web.routes,app.web.routes.common]
disallow_untyped_defs = True
disallow_incomplete_defs = True
