# mypy configuration for ser2net (CI job "mypy"; run locally with: mypy)
[mypy]
python_version = 3.10
# (not ser2netweb.py: next to the package of the same name mypy takes it for a duplicate
# module; ser2net.py, checked, has the same few lines)
files = ser2netweb, ser2net.py, bootstrap.py, tools, packaging/winget,
        packaging/homebrew/make_formula.py, packaging/aur/make_pkgbuild.py
# optional / platform-specific packages without type information
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
strict_equality = True
check_untyped_defs = True

# Fully annotated: the web layer (its routes, the REST API, sign-in, the proxy and the
# middleware). A new function there needs its types; the engine, the config and the rest
# are checked with check_untyped_defs only, for now.
[mypy-ser2netweb.web.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
