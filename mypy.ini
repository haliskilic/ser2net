# mypy configuration for ser2net (CI job "mypy"; run locally with: mypy)
[mypy]
python_version = 3.10
# (not ser2netweb.py: next to the package of the same name mypy takes it for a duplicate
# module; ser2net.py, checked, has the same few lines)
files = ser2netweb, ser2net.py, bootstrap.py, tools
# optional / platform-specific packages without type information
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
strict_equality = True
check_untyped_defs = True

# Fully annotated modules: a new function there needs its types. Extend this module by
# module (ser2netweb.web.routes.* and ser2netweb.web.api next) as the route handlers get annotated.
[mypy-ser2netweb.web.routes,ser2netweb.web.routes.common]
disallow_untyped_defs = True
disallow_incomplete_defs = True
